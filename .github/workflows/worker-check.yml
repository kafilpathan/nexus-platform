name: NEXUS Worker validation

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and engine ES module syntax
        run: |
          node --experimental-default-type=module --check cloudflare/worker.js
          node --experimental-default-type=module --check cloudflare/engine.js
          node --experimental-default-type=module --check cloudflare/benchmark-scoring.js
          node --experimental-default-type=module --check cloudflare/evaluation-manifest.js
      - name: Run Worker regression tests
        run: node --experimental-default-type=module --test tests/worker.test.mjs tests/benchmark-scoring.test.mjs tests/evaluation-manifest.test.mjs
