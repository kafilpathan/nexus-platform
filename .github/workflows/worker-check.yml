name: NEXUS Worker validation

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and engine ES module syntax
        run: |
          node --experimental-default-type=module --check cloudflare/worker.js
          node --experimental-default-type=module --check cloudflare/engine.js
          node --experimental-default-type=module --check cloudflare/benchmark-scoring.js
          node --experimental-default-type=module --check cloudflare/benchmark-suite.js
          node --experimental-default-type=module --check cloudflare/benchmark-comparison.js
          node --experimental-default-type=module --check cloudflare/experiment-fingerprint.js
          node --experimental-default-type=module --check cloudflare/source-provenance.js
          node --experimental-default-type=module --check cloudflare/contradiction-queue.js
          node --experimental-default-type=module --check cloudflare/knowledge-traversal.js
          node --experimental-default-type=module --check cloudflare/evaluation-stages.js
      - name: Run Worker regression tests
        run: node --experimental-default-type=module --test tests/worker.test.mjs tests/benchmark-scoring.test.mjs tests/benchmark-suite.test.mjs tests/benchmark-comparison.test.mjs tests/experiment-fingerprint.test.mjs tests/source-provenance.test.mjs tests/contradiction-queue.test.mjs tests/knowledge-traversal.test.mjs tests/evaluation-stages.test.mjs
