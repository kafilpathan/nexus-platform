name: NEXUS KAF-AI validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-and-safety-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and frontend JavaScript
        run: node scripts/validate.mjs
